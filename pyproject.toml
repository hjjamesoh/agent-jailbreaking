[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-refusal-directions"
version = "0.1.0"
description = "Category-specific refusal directions in multi-turn Llama 3.1 agents"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.33,<2",
  "huggingface-hub>=0.24,<2",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "torch>=2.7,<3",
  "transformers>=4.45,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
